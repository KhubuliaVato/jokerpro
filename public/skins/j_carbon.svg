<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" preserveAspectRatio="none"><style>
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.fall{animation:fall 7s linear infinite}@keyframes fall{from{transform:translateY(-12px)}to{transform:translateY(362px)}}
.spin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.dg{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:11px;animation:dg 10s linear infinite}@keyframes dg{from{transform:translateY(0)}to{transform:translateY(264px)}}
.zz{font-family:Arial,sans-serif;font-weight:700;font-size:17px;fill:#e0e7ff;opacity:0;animation:zz 3.6s ease-out infinite}@keyframes zz{0%{opacity:0;transform:translate(0,10px)}25%{opacity:1}100%{opacity:0;transform:translate(12px,-34px)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(5px)}}
.hl{animation:sw 3.2s ease-in-out infinite;transform-origin:82px 150px;transform-box:view-box}.hc{animation:sw 2.8s ease-in-out infinite reverse;transform-origin:125px 140px;transform-box:view-box}.hr{animation:sw 3.2s ease-in-out infinite reverse;transform-origin:168px 150px;transform-box:view-box}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.glow{animation:gl 1.8s ease-in-out infinite}@keyframes gl{50%{opacity:.45}}
.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,60%{transform:translateX(-300px)}100%{transform:translateX(300px)}}
</style>
